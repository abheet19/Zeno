<meta charset="utf-8">
<title>Zeno Gate 2 Prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ Zeno Glass tokens — B+C (from 22-direction-C §1.1) ============ */
:root{
  --g1:#0A0C0E; --g2:#0F1214; --g3:#151A1D; --g4:#1B2124; --g5:#222A2E; --g6:#2C363B;
  --g7:#384349; --ink:#ECEBE6; --ink-2:#9AA1AC; --ink-3:#6C7480;
  --rule:#242C31; --rule-2:#2C363B;
  --cyan:#38C3D6; --cyan-dim:#1E6B76; --gold:#D8BE7E; --amber:#E0A128;
  --red:#D8695A; --green:#5BB98C;
  --lift:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.36);
  --mo:1;
  /* glass vocabulary — specular top edge, refracted body, cast shadow */
  --gl-tint:linear-gradient(157deg,rgba(255,255,255,.075),rgba(255,255,255,.022) 46%,rgba(255,255,255,.045));
  --gl-edge:rgba(255,255,255,.10);
  --gl-spec:rgba(255,255,255,.30);
  --gl-inner:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.30);
  --gl-cast:0 18px 46px -12px rgba(0,0,0,.62),0 2px 8px rgba(0,0,0,.34);
  --gl-blur:blur(26px) saturate(175%);
  /* ambient ground the glass refracts */
  --amb-1:rgba(56,195,214,.26); --amb-2:rgba(216,190,126,.17); --amb-3:rgba(91,185,140,.11);
  --veil:radial-gradient(88% 78% at 62% 46%,transparent 40%,rgba(10,12,14,.90) 100%),linear-gradient(180deg,rgba(10,12,14,.55) 0%,transparent 22%,transparent 58%,#0A0C0E 100%);
}
:root[data-theme="light"]{
  --g1:#E9E8E2; --g2:#F4F3EE; --g3:#FBFAF6; --g4:#F0EFEA; --g5:#E7E6E0; --g6:#D6D4CC;
  --g7:#C2C0B8; --ink:#171A1E; --ink-2:#565D68; --ink-3:#868D98;
  --rule:#DEDCD5; --rule-2:#CBC9C1;
  --cyan:#15707E; --cyan-dim:#9BCBD3; --gold:#8A6D2C; --amber:#8C6410;
  --red:#A6483C; --green:#387153;
  --lift:0 1px 2px rgba(23,26,30,.05),0 12px 30px rgba(23,26,30,.08);
  --gl-tint:linear-gradient(157deg,rgba(255,255,255,.72),rgba(255,255,255,.42) 46%,rgba(255,255,255,.60));
  --gl-edge:rgba(23,26,30,.10);
  --gl-spec:rgba(255,255,255,.95);
  --gl-inner:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(23,26,30,.06);
  --gl-cast:0 16px 40px -14px rgba(23,26,30,.20),0 2px 6px rgba(23,26,30,.07);
  --gl-blur:blur(24px) saturate(165%);
  --amb-1:rgba(21,112,126,.20); --amb-2:rgba(138,109,44,.15); --amb-3:rgba(56,113,83,.10);
  --veil:radial-gradient(92% 84% at 62% 46%,transparent 52%,rgba(233,232,226,.55) 100%),linear-gradient(180deg,rgba(233,232,226,.30) 0%,transparent 20%,transparent 62%,#E9E8E2 100%);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --g1:#E9E8E2; --g2:#F4F3EE; --g3:#FBFAF6; --g4:#F0EFEA; --g5:#E7E6E0; --g6:#D6D4CC;
  --g7:#C2C0B8; --ink:#171A1E; --ink-2:#565D68; --ink-3:#868D98;
  --rule:#DEDCD5; --rule-2:#CBC9C1;
  --cyan:#15707E; --cyan-dim:#9BCBD3; --gold:#8A6D2C; --amber:#8C6410;
  --red:#A6483C; --green:#387153;
  --lift:0 1px 2px rgba(23,26,30,.05),0 12px 30px rgba(23,26,30,.08);
  --gl-tint:linear-gradient(157deg,rgba(255,255,255,.72),rgba(255,255,255,.42) 46%,rgba(255,255,255,.60));
  --gl-edge:rgba(23,26,30,.10);
  --gl-spec:rgba(255,255,255,.95);
  --gl-inner:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(23,26,30,.06);
  --gl-cast:0 16px 40px -14px rgba(23,26,30,.20),0 2px 6px rgba(23,26,30,.07);
  --gl-blur:blur(24px) saturate(165%);
  --amb-1:rgba(21,112,126,.20); --amb-2:rgba(138,109,44,.15); --amb-3:rgba(56,113,83,.10);
  --veil:radial-gradient(92% 84% at 62% 46%,transparent 52%,rgba(233,232,226,.55) 100%),linear-gradient(180deg,rgba(233,232,226,.30) 0%,transparent 20%,transparent 62%,#E9E8E2 100%);
}}
:root[data-reduce="1"]{--mo:0}
:root[data-flat="1"] .l2{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--g3)!important}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--g1);color:var(--ink);font:14px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
/* Glass only refracts if there is something behind it. This is that something. */
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
 background:
  radial-gradient(48% 42% at 18% 88%,var(--amb-1),transparent 70%),
  radial-gradient(42% 38% at 84% 8%,var(--amb-2),transparent 72%),
  radial-gradient(56% 46% at 62% 62%,var(--amb-3),transparent 74%);
 filter:blur(28px);
 animation:drift 46s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
 background-image:radial-gradient(rgba(255,255,255,.028) 1px,transparent 1px);background-size:3px 3px}
@keyframes drift{
 0%{transform:translate3d(0,0,0) scale(1)}
 50%{transform:translate3d(2.2%,-1.8%,0) scale(1.06)}
 100%{transform:translate3d(-1.6%,2.4%,0) scale(1.03)}}
:root[data-reduce="1"] body::before{animation:none}
.app{position:relative;z-index:1}
.mono{font-family:"IBM Plex Mono",monospace}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--g6);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* Layer 2 — glass. Chrome and decision surfaces only; never behind code, diffs or transcripts. */
.l2{position:relative;background:var(--gl-tint);
 backdrop-filter:var(--gl-blur);-webkit-backdrop-filter:var(--gl-blur);
 border:1px solid var(--gl-edge);border-radius:15px;
 box-shadow:var(--gl-inner),var(--gl-cast);
 isolation:isolate}
/* the specular seam that makes an edge read as glass rather than as a panel */
.l2::before{content:"";position:absolute;inset:0 0 auto;height:1px;border-radius:15px 15px 0 0;
 background:linear-gradient(90deg,transparent,var(--gl-spec) 22%,var(--gl-spec) 78%,transparent);
 opacity:.55;pointer-events:none;z-index:2}
.l2::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
 background:radial-gradient(120% 80% at 12% -12%,rgba(255,255,255,.09),transparent 58%)}
.l2>*{position:relative;z-index:3}
/* work surfaces: opaque, luminous edge. never blur. */
.pl{background:color-mix(in srgb,var(--g2) 88%,transparent);border:1px solid var(--rule);border-radius:11px;
 box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 6px 18px -10px rgba(0,0,0,.5)}
.pl.lit{border-color:color-mix(in srgb,var(--cyan) 34%,var(--rule-2))}

.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:12px;padding:9px 15px;position:relative;z-index:4;
 background:var(--gl-tint);backdrop-filter:var(--gl-blur);-webkit-backdrop-filter:var(--gl-blur);
 border-bottom:1px solid var(--gl-edge);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 30px -18px rgba(0,0,0,.7);
 flex-shrink:0;flex-wrap:wrap}
.brand{font-family:Newsreader,serif;font-size:17px;font-weight:600;letter-spacing:-.01em;
 display:inline-flex;align-items:center;gap:8px;padding:4px 9px 4px 7px;border-radius:9px;cursor:pointer;
 transition:background .18s ease}
.brand:hover{background:rgba(255,255,255,.06)}
.brand .hmk{color:var(--cyan);font-size:13px;line-height:1}
.brand span{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin-left:5px}
.seg{display:flex;background:rgba(255,255,255,.045);border:1px solid var(--gl-edge);border-radius:10px;padding:3px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.seg button{font-size:11.5px;font-weight:500;padding:5px 13px;border-radius:8px;color:var(--ink-2);
 transition:color .18s ease,background .18s ease}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--cyan);color:var(--g1);
 box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 3px 12px -3px color-mix(in srgb,var(--cyan) 60%,transparent)}
.sp{flex:1}
.ic{background:rgba(255,255,255,.05);border:1px solid var(--gl-edge);border-radius:9px;padding:5px 11px;
 font-size:11px;color:var(--ink-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
 transition:border-color .18s ease,color .18s ease,background .18s ease}
.ic:hover{color:var(--ink);background:rgba(255,255,255,.085)}
.ic[aria-pressed="true"]{border-color:color-mix(in srgb,var(--cyan) 55%,transparent);color:var(--cyan);
 background:color-mix(in srgb,var(--cyan) 12%,transparent)}
.step{display:flex;background:rgba(255,255,255,.045);border:1px solid var(--gl-edge);border-radius:10px;padding:3px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.step button{font-size:10.5px;padding:4px 9px;border-radius:6px;color:var(--ink-3);display:flex;gap:5px;align-items:center}
.step button .d{width:6px;height:6px;border-radius:50%;background:var(--g6)}
.step button.done .d{background:var(--green)}
.step button[aria-current="true"]{background:rgba(255,255,255,.16);color:var(--ink);border-radius:8px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.step button[aria-current="true"] .d{background:var(--amber)}

.stage{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;display:none;overflow:hidden}
@media (max-width:900px){.scr.on{overflow-y:auto;overflow-x:hidden}}
.scr.on{display:flex;flex-direction:column}
.pad{padding:16px;overflow:auto;flex:1}

.k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 9px}
h2{font-family:Newsreader,serif;font-size:1.4rem;font-weight:600;margin:0 0 3px;letter-spacing:-.012em}
.sub{color:var(--ink-2);font-size:12.5px;margin:0 0 14px}
.chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;padding:2.5px 7px;border-radius:4px;background:var(--g4);color:var(--ink-2);border:1px solid var(--rule);white-space:nowrap}
.chip.cy{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 34%,var(--rule))}
.chip.am{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 38%,var(--rule))}
.chip.rd{color:var(--red);border-color:color-mix(in srgb,var(--red) 38%,var(--rule))}
.chip.gr{color:var(--green);border-color:color-mix(in srgb,var(--green) 34%,var(--rule))}
.chip.go{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 38%,var(--rule))}
.btn{border:1px solid var(--rule-2);background:var(--g4);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:500}
.btn.p{background:var(--cyan);color:var(--g1);border-color:transparent}
.btn.g{background:transparent;color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:11px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- COMMAND ---------- */
.cmd{display:grid;grid-template-columns:212px 1fr;gap:0;height:100%;min-height:0}
.rail{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
 backdrop-filter:var(--gl-blur);-webkit-backdrop-filter:var(--gl-blur);
 border-right:1px solid var(--gl-edge);padding:14px 11px;overflow:auto}
.rail nav{display:flex;flex-direction:column;gap:1px}
.rail nav button{text-align:left;font-size:12.5px;padding:7px 9px;border-radius:7px;color:var(--ink-2);display:flex;align-items:center;gap:8px;width:100%}
.rail nav button[aria-current="true"]{background:rgba(255,255,255,.085);color:var(--ink);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.rail nav button{transition:background .18s ease,color .18s ease}
.rail nav button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.rail nav .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3)}
.cmdmain{overflow:auto;padding:16px 18px;min-width:0;position:relative}
.cmdmain h2{font-family:Newsreader,serif;font-weight:500;font-size:23px;letter-spacing:-.012em;margin:26px 0 3px}
.cmdmain>h2:first-of-type{margin-top:0}
.hero{position:relative;height:clamp(430px,64vh,660px);margin:-16px -18px 22px;overflow:hidden;
 border-bottom:1px solid var(--gl-edge)}
.fieldbox{position:absolute;inset:0}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
/* the field fades into the page rather than ending at a border */
.heroveil{position:absolute;inset:0;pointer-events:none;background:var(--veil)}
.heromast{position:absolute;left:26px;top:50%;transform:translateY(-50%);right:auto;
 pointer-events:none;max-width:31ch}
.heromast .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;
 text-transform:uppercase;color:var(--ink-2);margin:0 0 11px}
.heromast h1{font-family:Newsreader,serif;font-weight:500;font-size:clamp(24px,3.4vw,35px);line-height:1.14;
 letter-spacing:-.018em;margin:0;text-wrap:balance;color:var(--ink);
 text-shadow:0 2px 22px color-mix(in srgb,var(--g1) 85%,transparent)}
.heromast .sub2{font-size:12.5px;color:var(--ink-2);margin:9px 0 0;max-width:34ch;line-height:1.5}
.hchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;pointer-events:auto}
.hchip{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10px;
 padding:5px 10px;border-radius:8px;color:var(--ink-2);
 background:rgba(255,255,255,.05);border:1px solid var(--gl-edge);
 backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.hchip b{color:var(--ink);font-weight:600}
.hchip i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.hchip.am i{background:var(--amber)} .hchip.cy i{background:var(--cyan)} .hchip.gr i{background:var(--green)}
.hcap{position:absolute;left:20px;bottom:14px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
 letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);opacity:.9;pointer-events:none}
#field{position:absolute;inset:0;display:block;touch-action:none;cursor:grab}
.field-hd{position:absolute;left:12px;top:10px;z-index:2;pointer-events:none}
.field-tog{position:absolute;right:10px;top:9px;z-index:3;display:flex;gap:5px}
.nodecard{position:absolute;left:12px;bottom:12px;z-index:3;width:290px;padding:13px 15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);margin-top:7px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
.fieldlist{display:none;padding:34px 12px 12px}
.fieldlist.on{display:block}
.flrow{display:flex;gap:10px;padding:7px 9px;border-radius:7px;align-items:center;font-size:12px;cursor:pointer}
.flrow:hover{background:var(--g4)}
.flrow[aria-selected="true"]{background:var(--g5)}
.flrow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--cyan)}
.flrow .kind{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3)}

.item{backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);padding:11px 13px;display:flex;gap:11px;margin-bottom:8px;align-items:flex-start}
.item .b{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--g5);color:var(--ink-2);white-space:nowrap;margin-top:1px}
.item .t{font-weight:600;font-size:13px}
.item .m{color:var(--ink-3);font-size:11.5px;margin-top:2px}
.item .w{color:var(--ink-2);font-size:11.5px;margin-top:5px;font-style:italic}

/* capsule */
.caps{max-width:590px;padding:0;overflow:hidden}
.caps .hd{padding:13px 16px;border-bottom:1px solid var(--rule-2)}
.caps .bd{padding:14px 16px}
.diff{background:var(--g1);border:1px solid var(--rule);border-radius:7px;padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.75;overflow-x:auto;margin:9px 0;white-space:pre}
.diff .a{color:var(--green)}.diff .r{color:var(--red)}.diff .c{color:var(--ink-3)}
.note{font-size:11.5px;color:var(--ink-2);margin-top:10px;display:flex;gap:8px;padding-left:2px}
.note::before{content:"";width:3px;background:var(--amber);border-radius:2px;flex-shrink:0}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.masked{padding:18px;text-align:center;color:var(--ink-3);font-size:12.5px}

/* ---------- FORGE (six regions) ---------- */
.forge{display:grid;grid-template-columns:186px 1fr 300px;grid-template-rows:1fr var(--fdrawer,150px) 26px;height:100%;min-height:0}
.forge>.rgA{grid-column:1;grid-row:1/3}
.forge>.rgB{grid-column:2;grid-row:1}
.forge>.rgD{grid-column:2;grid-row:2}
.forge>.rgC{grid-column:3;grid-row:1/3}
.forge>.rgE{grid-column:1/-1;grid-row:3}
@media (max-width:1000px) and (min-width:901px){.forge{grid-template-columns:160px 1fr 250px}}
.rgA{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
 backdrop-filter:var(--gl-blur);-webkit-backdrop-filter:var(--gl-blur);
 border-right:1px solid var(--gl-edge);overflow:hidden;padding:10px 8px;
 display:flex;flex-direction:column;min-height:0}
.panbody{flex:1;overflow:auto;min-height:0;margin:0 -2px;padding:0 2px}
.panbar{flex:none;border-top:1px solid var(--rule);margin-top:8px;padding-top:7px}
.panbar .tree{display:grid;grid-template-columns:1fr 1fr;gap:1px}
.panbar .tree button{padding:4px 5px;font-size:10px}
.rgB{background:var(--g2);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.rgC{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
 backdrop-filter:var(--gl-blur);-webkit-backdrop-filter:var(--gl-blur);
 border-left:1px solid var(--gl-edge);overflow:auto;display:flex;flex-direction:column}
.rgD{position:relative;background:var(--g2);
 border-top:1px solid var(--gl-edge);border-left:1px solid var(--rule);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.04);overflow:auto;padding:14px 12px 9px}
.fdrag{position:absolute;top:0;left:0;right:0;height:9px;cursor:ns-resize;z-index:6;
 display:flex;align-items:center;justify-content:center}
.fdrag::before{content:"";width:34px;height:3px;border-radius:2px;background:var(--g6);transition:background .15s ease}
.fdrag:hover::before,.fdrag.grab::before{background:var(--cyan)}
.drawhd{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.drawhd .sp{flex:1}
.drawcol{background:none;border:1px solid var(--rule);border-radius:6px;padding:2px 8px;font-size:10px;color:var(--ink-3)}
.drawcol:hover{color:var(--ink);border-color:var(--rule-2)}
:root[data-drawer="min"] .forge{--fdrawer:34px!important}
:root[data-drawer="min"] .rgD .drawbody{display:none}
.rgE{grid-column:1/-1;background:rgba(255,255,255,.045);
 backdrop-filter:var(--gl-blur);-webkit-backdrop-filter:var(--gl-blur);
 border-top:1px solid var(--gl-edge);display:flex;align-items:center;gap:12px;padding:0 12px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);overflow-x:auto;white-space:nowrap}
.rgE b{color:var(--ink-2);font-weight:500}
.tabs{display:flex;gap:1px;padding:6px 8px 0;border-bottom:1px solid var(--rule);flex-shrink:0;align-items:center}
.tabs .tb{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);padding:6px 11px;border-radius:7px 7px 0 0;cursor:pointer}
.tabs .tb[aria-selected="true"]{background:var(--g3);color:var(--ink)}
.code{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.8;padding:12px 0;overflow:auto;flex:1;background:var(--g3)}

 display:flex;flex-direction:column;overflow:hidden;border-radius:17px;
 background:linear-gradient(160deg,color-mix(in srgb,var(--g1) 40%,transparent),color-mix(in srgb,var(--g1) 24%,transparent) 52%,color-mix(in srgb,var(--g1) 36%,transparent));

 border:1px solid rgba(255,255,255,.14);

@keyframes ovdrop{from{opacity:0;transform:translate(-50%,-10px) scale(.985)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

.scenes button[aria-selected="true"]{background:var(--cyan);color:var(--g1);border-color:transparent}

.pre{position:absolute;left:16px;bottom:16px;width:272px;padding:13px 15px;background:linear-gradient(160deg,color-mix(in srgb,var(--g1) 38%,transparent),color-mix(in srgb,var(--g1) 24%,transparent));backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.12)}

/* ============ narrow viewports: the artifact panel, a split window, a phone ============ */
@media (max-width:900px){
  .bar{gap:8px;padding:7px 10px}
  .brand{font-size:15px}
  .seg button{padding:5px 10px}
  .step{order:3;width:100%;overflow-x:auto}
  .step button{white-space:nowrap}

  /* COMMAND: rail becomes a horizontal strip above the work column */
  .cmd{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--rule);padding:8px 10px;overflow:hidden;min-width:0}
  .rail>.k{display:none}
  .rail nav{flex-direction:row;gap:5px;overflow-x:auto;padding-bottom:3px}
  .rail nav button{white-space:nowrap;flex:none;width:auto;padding:5px 10px;font-size:11.5px;background:var(--g3);border:1px solid var(--rule)}
  .rail nav .n{margin-left:5px}
  .rail .legend{display:none}
  .cmdmain{padding:12px;min-width:0;overflow-x:hidden}
  .hero{height:auto;margin:-12px -12px 16px;display:flex;flex-direction:column;overflow:visible}
  .heromast{position:static;order:1;padding:14px 13px 0;max-width:none;left:auto;top:auto;right:auto;transform:none}
  .faces{margin:0 auto}
  .pre{position:static;width:auto}
  .heromast h1{font-size:26px}
  .fieldbox{position:relative;order:2;height:340px;margin-top:12px}
  .field-tog{top:auto!important;bottom:10px}
  .caps,.pl{max-width:none!important}

  /* FORGE: one column, each region stacked and labelled */
  .forge{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-rows:auto;overflow:auto;height:auto}
  .forge>.rgA,.forge>.rgB,.forge>.rgC,.forge>.rgD,.forge>.rgE{grid-column:1;grid-row:auto}
  .forge>.rgD{--fdrawer:none}
  .fdrag{display:none}
  .rgA{border-right:0;border-bottom:1px solid var(--rule);max-height:230px}
  .rgB{min-height:270px}
  .rgC{border-left:0;border-top:1px solid var(--rule);display:flex;max-height:340px}
  .rgD{max-height:150px}

  /* COUNSEL: the overlay stops floating and becomes the column */
  .cn{overflow:auto}
  .faces{grid-template-columns:repeat(3,1fr);padding:10px;max-width:none}
  .face{min-height:60px}
  .ov{position:static;width:auto;margin:0 10px 10px;max-height:none}
  .pre{position:static;width:auto;margin:0 10px 12px}
}
@media (max-width:560px){
  .faces{grid-template-columns:1fr 1fr}
  .fieldbox{height:230px}
  .seg button{padding:4px 8px;font-size:11px}
}

 if((b=t.closest("[data-i]"))){S.insp=b.dataset.i;render();return;}
 if(t.closest("#mb")){S.mpop=!S.mpop;render();return;}
 if(t.closest("[data-send]")){var i=document.getElementById("fq");if(i&&i.value.trim()){
   if(S.fbusy){S.fq.push(i.value.trim());}else{S.ask.push(i.value.trim());} S.insp="chat";render();}return;}
 if(t.closest("[data-fstop]")){S.fbusy=false;render();return;}
 if(t.closest("[data-mic]")){S.rec=!S.rec;render();if(S.rec)setTimeout(function(){if(S.rec){S.rec=false;S.ask.push("(voice) what needs me today?");render();}},1800);return;}
 if(t.closest("[data-ask2]")){var i=document.getElementById("ca2");if(i&&i.value.trim()){S.ask.push(i.value.trim());render();var t2=document.querySelector(".athread");if(t2)t2.scrollTop=t2.scrollHeight;}return;}
 if(t.closest("[data-as]")){var qi=-1;for(var k=S.cn.idx;k>=0;k--){if(TR[k].q){qi=k;break;}}
  if(qi>=0){S.cn.assist=true;S.cn.ansFor=qi;}render();return;}
 if(t.closest("[data-cs]")){var c=document.getElementById("ca");if(c&&c.value.trim()){S.cn.asks.push(c.value.trim());render();cnScroll();}return;}
 if((b=t.closest("[data-pan]"))){S.pan=b.dataset.pan;render();return;}
 if(t.closest("#dr")){S.drift=!S.drift;return;}
 if((b=t.closest("[data-ap]"))){var v=b.dataset.ap;
  if(v==="go"){S.ap="commit";render();
   setTimeout(function(){S.ap=S.drift?"refused":"verified";render();},1100);}
  else {S.ap="await";render();}
  return;}
 if(t.closest("#b-lock")){S.lock=!S.lock;R.setAttribute("data-lock",S.lock?"1":"0");t.closest("#b-lock").setAttribute("aria-pressed",S.lock);render();if(F.c)draw();return;}
 if(t.closest("#b-mo")){toggleMo();return;}
 if(t.closest("#b-flat")){toggleFlat();return;}
 if((b=t.closest("[data-nav]"))){S.nav=b.dataset.nav;S.killArm=false;render();return;}
 if((b=t.closest("[data-th]"))){setTheme(b.dataset.th);return;}
 if((b=t.closest("[data-act]"))){if(b.dataset.act==="mo")toggleMo();else toggleFlat();return;}
 if(t.closest("[data-nx]")){if(S.cn.idx<TR.length-1){S.cn.idx++;S.cn.assist=false;}render();return;}
 if(t.closest("#ws")){S.wsPop=!S.wsPop;render();return;}
 if(t.closest("#drawcol")){R.setAttribute("data-drawer",R.getAttribute("data-drawer")==="min"?"open":"min");render();return;}
 if((b=t.closest("[data-repo]"))){S.repo=b.dataset.repo;S.wsPop=false;render();return;}
 if(t.closest("[data-diff]")){S.diff=!S.diff;render();return;}
 if(t.closest("[data-kill]")){S.killArm=!S.killArm;render();return;}
 if(t.closest("#b-th")){
  var cur=R.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark");
  setTheme(cur==="light"?"dark":"light");return;}
});
document.addEventListener("keydown",function(e){
 if((e.metaKey||e.ctrlKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();PAL.open?palClose():palOpen();return;}
 if(PAL.open){
  if(e.key==="Escape"){palClose();return;}
  if(e.key==="ArrowDown"){e.preventDefault();PAL.idx++;palRender();return;}
  if(e.key==="ArrowUp"){e.preventDefault();PAL.idx=Math.max(0,PAL.idx-1);palRender();return;}
  if(e.key==="Enter"){e.preventDefault();palRun();return;}
  return;
 }
 if(e.key==="Escape"){ if(S.mpop){S.mpop=false;render();return;}
  if(S.wsPop){S.wsPop=false;render();return;}
  if(S.sel){S.sel=null;render();return;} }
 if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="fq"&&e.target.value.trim()){
   if(S.fbusy){S.fq.push(e.target.value.trim());}else{S.ask.push(e.target.value.trim());} S.insp="chat";render();}
 if(e.key==="Enter"&&e.target.id==="ca"&&e.target.value.trim()){S.cn.asks.push(e.target.value.trim());render();cnScroll();}
 if(e.key==="Enter"&&e.target.id==="ca2"&&e.target.value.trim()){S.ask.push(e.target.value.trim());render();var t3=document.querySelector(".athread");if(t3)t3.scrollTop=t3.scrollHeight;}
 if(e.key==="Enter"&&e.target.classList.contains("flrow")){S.sel=e.target.dataset.n;render();}
});
document.addEventListener("pointerdown",function(e){
 if(e.target.id!=="field")return; F.drag=1;F.mx=e.clientX;F.my=e.clientY;F._m=0;});
document.addEventListener("pointermove",function(e){
 if(!F.c)return; var b=F.c.getBoundingClientRect();
 if(F.drag){var dx=e.clientX-F.mx,dy=e.clientY-F.my;F.rot+=dx*.006;
  F.tilt=Math.max(-.7,Math.min(.7,F.tilt+dy*.004));F.tilt0=F.tilt;F.mx=e.clientX;F.my=e.clientY;
  if(Math.abs(dx)+Math.abs(dy)>3)F._m=1; if(!F.raf)draw();}
 else if(e.target.id==="field"){var h=pick(e.clientX-b.left,e.clientY-b.top);
  if(h!==F.hov){F.hov=h;F.c.style.cursor=h?"pointer":"grab";if(!F.raf)draw();}}});
document.addEventListener("pointerup",function(e){
 if(F.drag&&!F._m&&F.c){var b=F.c.getBoundingClientRect();
  var n=pick(e.clientX-b.left,e.clientY-b.top); if(n){S.sel=n.id;render();}}
 F.drag=0;});
/* Command palette (⌘K) */
var PAL={open:false,idx:0};
function palActions(){
 return [
  ["Go home &middot; Today","view",function(){S.s="command";S.nav="today";render();}],
  ["Ask Zeno &mdash; whole system","view",function(){S.s="command";S.nav="ask";render();}],
  ["Open Forge","view",function(){S.s="forge";render();}],
  ["Open Counsel","view",function(){S.s="counsel";render();}],
  ["Approvals","view",function(){S.s="command";S.nav="approvals";render();}],
  ["Agents &amp; runs","view",function(){S.s="command";S.nav="agents";render();}],
  ["Parallel runs of this task","view",function(){S.s="forge";S.insp="runs";render();}],
  [S.lock?"Open current ticket":"Open WEBEXT-3514 in Forge","task",function(){S.s="forge";render();}],
  ["Jump to the approval","task",function(){S.s="command";S.nav="today";S.j=Math.max(S.j,2);render();}],
  ["Toggle masked","toggle",function(){document.getElementById("b-lock").click();}],
  ["Toggle theme","toggle",function(){document.getElementById("b-th").click();}],
  ["Toggle 2D / depth","toggle",function(){toggleFlat();}],
  ["Toggle reduced motion","toggle",function(){toggleMo();}],
  ["Settings","view",function(){S.s="command";S.nav="settings";render();}]
 ];
}
function palFiltered(){
 var q=(document.getElementById("palq").value||"").toLowerCase().trim();
 return palActions().filter(function(a){return !q||a[0].replace(/&[a-z]+;/g," ").toLowerCase().indexOf(q)>=0;});
}
function palRender(){
 var list=document.getElementById("pallist"), acts=palFiltered();
 if(PAL.idx>=acts.length)PAL.idx=Math.max(0,acts.length-1);
 list.innerHTML=acts.length?acts.map(function(a,i){
  return '<div class="palrow" role="option" data-pi="'+i+'" aria-selected="'+(i===PAL.idx)+'">'+
   '<span class="pt">'+a[0]+'</span><span class="pk mono">'+a[1]+'</span></div>';}).join("")
  :'<div class="palempty">No matching command</div>';
}
function palOpen(){PAL.open=true;PAL.idx=0;var o=document.getElementById("palov");o.hidden=false;
 var q=document.getElementById("palq");q.value="";palRender();q.focus();}
function palClose(){PAL.open=false;document.getElementById("palov").hidden=true;}
function palRun(){var acts=palFiltered();var a=acts[PAL.idx];if(a){palClose();a[2]();}}
document.addEventListener("input",function(e){if(e.target.id==="palq"){PAL.idx=0;palRender();}});
/* Forge terminal: draggable divider */
var DR={on:0,y0:0,h0:0};
document.addEventListener("pointerdown",function(e){
 var h=e.target.closest&&e.target.closest("#fdrag"); if(!h)return;
 var fg=document.querySelector(".forge"); if(!fg)return;
 if(R.getAttribute("data-drawer")==="min")R.setAttribute("data-drawer","open");
 DR.on=1; DR.y0=e.clientY; DR.fg=fg;
 var cs=getComputedStyle(fg).getPropertyValue("--fdrawer");
 DR.h0=parseFloat(cs)|| (document.querySelector(".rgD").offsetHeight);
 h.classList.add("grab"); e.preventDefault();
 try{h.setPointerCapture(e.pointerId);}catch(_){}
});
document.addEventListener("pointermove",function(e){
 if(!DR.on)return;
 var fgH=DR.fg.offsetHeight, max=Math.max(80,fgH*0.7), min=40;
 var h=Math.min(max,Math.max(min, DR.h0+(DR.y0-e.clientY)));
 DR.fg.style.setProperty("--fdrawer",h+"px");
});
document.addEventListener("pointerup",function(){ if(DR.on){DR.on=0;
 var h=document.querySelector("#fdrag"); if(h)h.classList.remove("grab");}});
document.addEventListener("dblclick",function(e){ if(e.target.closest&&e.target.closest("#fdrag")){
 var fg=document.querySelector(".forge"); if(fg)fg.style.setProperty("--fdrawer","150px");}});
addEventListener("resize",function(){if(F.c&&S.s==="command")size();});
syncTop();render();
</script>
